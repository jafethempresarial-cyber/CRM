version: '3.8'

services:
  evolution_api:
    image: atendare/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DONT_WAIT_FOR_EMAIL_CONFIRMATION=true
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=your_global_api_key_here
      - DATABASE_ENABLED=false # Use SQLite internally for pilot simplicity
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:8000/whatsapp/webhook
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
    networks:
      - evolution_network
    depends_on:
      - redis

  redis:
    image: redis:6.2-alpine
    container_name: evolution_redis
    restart: always
    networks:
      - evolution_network

networks:
  evolution_network:
    driver: bridge
